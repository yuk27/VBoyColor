apply plugin: 'com.android.application'

// android/local.properties (gitignored): machine-specific settings -
// keystore.dir and colorpacks.dir (both below).
def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

// Color packs built into the app: set colorpacks.dir to a folder holding
// "<rom name>.vbcp" files - typically the desktop build's roms folder, where
// it rebuilds a game's pack whenever that game (with a colorpacks/ folder) is
// loaded - and every build bundles its *.vbcp files (nothing else - never
// ROMs) as assets colorpacks/<rom name>.vbcp. Emulator::ReloadColorPack uses
// those when the headset's ROMs folder has no .vbcp of its own for the game.
// Unset = none bundled. Packs never go into the repo.
def colorPacksDir = localProps.getProperty("colorpacks.dir")
def colorPackAssets = new File(layout.buildDirectory.get().asFile, "generated/colorpack-assets")

android {
    namespace "io.github.yuk27.vboycolor"
    ndkVersion "23.2.8568313"

    compileSdk 34

    defaultConfig {
        applicationId "io.github.yuk27.vboycolor"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
                // VBGO_RELEASE_BUILD is deliberately independent of the
                // debug/release build type (see CMakeLists.txt) - assembleRelease
                // is normally still just a fast local build for on-device
                // testing (dev version string). Only pass -Pofficial=true when
                // actually cutting a numbered release.
                if (project.hasProperty("official")) {
                    arguments "-DVBGO_RELEASE_BUILD=ON"
                }
                cppFlags "-std=c++17"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"
            version "3.22.1"
        }
    }

    // assets/runtime/ holds exactly what AndroidPlatform::LoadAssetBytes
    // reads at runtime (fonts + icon atlases). Everything else dev-only that
    // lives under assets/ (icons.svg, the per-size icons_NN/ source PNGs
    // feeding tools/pack_icon_atlas.py, cartridge.png, icons/README.md,
    // PlaceRomsHere.txt) stays outside this directory and is never
    // bundled. AGP's asset merging
    // doesn't honor include/exclude filters on a sourceSet (only whole
    // srcDirs), so this split-by-directory is the actual allow-list: add a
    // new runtime asset by putting it under assets/runtime/, and it's
    // packaged; anything else silently isn't, so a missing LoadAssetBytes
    // call surfaces as an asset load failure telling you to move it there.
    sourceSets {
        main {
            manifest.srcFile "AndroidManifest.xml"
            assets.srcDirs = ["../../assets/runtime", colorPackAssets]
        }
    }

    // Release key, kept outside the repo: keystore.dir in
    // android/local.properties (gitignored) names a folder with
    // android.keystore (alias key0) and keystore.txt (line 1 = store
    // password, line 2 = key password). The CI passes the same as
    // environment variables (VBC_KEYSTORE = the keystore file,
    // VBC_STORE_PASSWORD, VBC_KEY_PASSWORD). Neither = release builds are
    // signed with the debug key, so they still install.
    def keystoreDir = localProps.getProperty("keystore.dir")
    def keystoreFile = null
    def ksStorePassword = null
    def ksKeyPassword = null
    if (keystoreDir != null && new File(keystoreDir, "keystore.txt").exists()) {
        def keystoreProps = new File(keystoreDir, "keystore.txt").readLines()
        keystoreFile = new File(keystoreDir, "android.keystore")
        ksStorePassword = keystoreProps[0].trim()
        ksKeyPassword = keystoreProps[1].trim()
    } else if (System.getenv("VBC_KEYSTORE") && new File(System.getenv("VBC_KEYSTORE")).exists()) {
        keystoreFile = new File(System.getenv("VBC_KEYSTORE"))
        ksStorePassword = System.getenv("VBC_STORE_PASSWORD")
        ksKeyPassword = System.getenv("VBC_KEY_PASSWORD")
    }

    signingConfigs {
        if (keystoreFile != null) {
            release {
                storeFile keystoreFile
                storePassword ksStorePassword
                keyAlias "key0"
                keyPassword ksKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystoreFile != null ? signingConfigs.release : signingConfigs.debug
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

// Copies the packs to bundle (see colorpacks.dir above) before every build -
// fresh each time, so a pack removed from that folder leaves the app too.
def bundleColorPacks = tasks.register("bundleColorPacks") {
    def packs = colorPacksDir != null ? fileTree(colorPacksDir) { include "*.vbcp" } : files()
    inputs.files(packs)
    outputs.dir(colorPackAssets)
    doLast {
        if (colorPacksDir != null && !new File(colorPacksDir).isDirectory()) {
            logger.warn("colorpacks.dir (android/local.properties) isn't a folder: ${colorPacksDir} - no color packs bundled")
        }
        project.delete(colorPackAssets)
        def destDir = new File(colorPackAssets, "colorpacks")
        destDir.mkdirs()
        project.copy {
            from(packs)
            into(destDir)
        }
        // colorpacks/index.txt: the ROM each pack was made for (its 16-byte
        // "VBGOROM1" footer: CRC-32, size), so a game finds its pack whatever
        // its ROM file is called (see Emulator::FindPackForRom).
        def index = []
        destDir.listFiles().findAll { it.name.endsWith(".vbcp") }.sort { it.name }.each { pack ->
            def bytes = pack.bytes
            if (bytes.length >= 28 && new String(bytes, bytes.length - 16, 8, "US-ASCII") == "VBGOROM1") {
                def buf = java.nio.ByteBuffer.wrap(bytes, bytes.length - 8, 8).order(java.nio.ByteOrder.LITTLE_ENDIAN)
                def crc = Integer.toUnsignedLong(buf.getInt())
                def size = Integer.toUnsignedLong(buf.getInt())
                index << String.format("%08x %d %s", crc, size, pack.name)
            } else {
                logger.lifecycle("  ${pack.name}: made before packs recorded their ROM - found only by the ROM's file name")
            }
        }
        new File(destDir, "index.txt").setText(index.join("\n") + "\n", "UTF-8")
        def bundled = destDir.list().findAll { it.endsWith(".vbcp") }.sort()
        logger.lifecycle("Bundled ${bundled.size()} color pack(s) (${index.size()} findable by ROM checksum): ${bundled.join(', ')}")
    }
}
tasks.named("preBuild").configure { dependsOn(bundleColorPacks) }
