# Builds VBoy Color for Windows, Linux and Quest/Android on pushes and pull
# requests that change the app (see on: below); a tag v* also publishes a
# GitHub release with the three downloads (a pre-release for a tag with a
# dash, like v1.0.0-beta.1).
#
# A failed step reports the end of its log as an error annotation, so the
# reason shows on the run's summary page.
#
# Android release signing: repository secrets ANDROID_KEYSTORE_BASE64
# (base64 of the .keystore file, key alias key0) and ANDROID_STORE_PASSWORD
# (+ ANDROID_KEY_PASSWORD only if the key's password differs) - made by
# tools/make_release_key.ps1. With them every APK has the same signature, so
# each one installs over the last. Without them a branch build is signed with
# a throwaway debug key (a new one every run - installing it means
# uninstalling the old one first), and a release tag fails: a release must
# never ship with a key its updates can't match.

name: Build

# Pushes that only touch the docs, pictures or dev-only scripts don't build
# (a tag always does - paths aren't checked for tags); Actions > Build > Run
# workflow builds by hand. A newer push stops the older one's build.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "images/**"
      - "LICENSE"
      - ".gitignore"
      - "tools/**.py"
      - "tools/**.ps1"
      - "tools/**.bat"
      - "tools/harness/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "images/**"
      - "LICENSE"
      - ".gitignore"
      - "tools/**.py"
      - "tools/**.ps1"
      - "tools/**.bat"
      - "tools/harness/**"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # A release tag (v1.0.0) builds the clean version string; a pre-release
  # tag (v1.0.0-beta.2) builds its own name ("v1.0.0-beta.2" - PRERELEASE
  # is what follows the first dash); anything else the dev one.
  OFFICIAL: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && 'ON' || 'OFF' }}
  PRERELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-') && github.ref_name || '' }}

jobs:
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure
        run: |
          set -o pipefail
          cmake -B build-pc -A x64 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DVBGO_RELEASE_BUILD=$OFFICIAL -DVBGO_PRERELEASE="${PRERELEASE#*-}" 2>&1 | tee build.log

      - name: Build
        run: |
          set -o pipefail
          cmake --build build-pc --config Release --target VBoyColor VBoyColorVR --parallel 2>&1 | tee build.log

      - name: Package
        run: |
          set -e
          version=$(sed -n 's/.*kGeneratedVersionString = "\([^"]*\)".*/\1/p' build-pc/generated/Version.h)
          dir=VBoyColor-$version-windows-x64
          mkdir -p "$dir/roms"
          cp build-pc/Release/VBoyColor.exe build-pc/Release/VBoyColorVR.exe "$dir/"
          cp build-pc/Release/*.dll "$dir/" 2>/dev/null || true
          cp -r build-pc/Release/colorpacks "$dir/"
          cp assets/PlaceRomsHere.txt "$dir/roms/"
          cp -r README.md LICENSE THIRD-PARTY-NOTICES.md licenses "$dir/"
          7z a -tzip "$dir.zip" "$dir" > /dev/null
          echo "PACKAGE=$dir" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}.zip
          if-no-files-found: error

      - name: Report the failure
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          tail -n 60 build.log | sed 's/%/%25/g; s/\r//g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=windows::/'
          echo

  # x86-64, and ARM64 for the Steam Frame (its SteamOS is ARM64 Linux) and
  # other ARM64 Linux boxes. Both the window app and the VR app.
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: ubuntu-22.04
          - arch: arm64
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libvulkan1

      - name: Configure
        run: |
          set -o pipefail
          cmake -B build-pc -G Ninja -DCMAKE_BUILD_TYPE=Release -DGLFW_BUILD_WAYLAND=OFF -DVBGO_RELEASE_BUILD=$OFFICIAL -DVBGO_PRERELEASE="${PRERELEASE#*-}" 2>&1 | tee build.log

      - name: Build
        run: |
          set -o pipefail
          cmake --build build-pc --target VBoyColor VBoyColorVR 2>&1 | tee build.log

      - name: Package
        run: |
          set -e
          version=$(sed -n 's/.*kGeneratedVersionString = "\([^"]*\)".*/\1/p' build-pc/generated/Version.h)
          dir=VBoyColor-$version-linux-${{ matrix.arch }}
          mkdir -p "$dir/roms"
          cp build-pc/VBoyColor build-pc/VBoyColorVR "$dir/"
          strip "$dir/VBoyColor" "$dir/VBoyColorVR"
          cp -r build-pc/fonts build-pc/icons build-pc/logo build-pc/colorpacks build-pc/icon.png "$dir/"
          cp assets/PlaceRomsHere.txt "$dir/roms/"
          cp -r assets/steam "$dir/steam" # (library artwork for adding it to Steam)
          cp platform/desktop/install-to-steam.py "$dir/"
          cp -r README.md LICENSE THIRD-PARTY-NOTICES.md licenses "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          echo "PACKAGE=$dir" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}.tar.gz
          if-no-files-found: error

      - name: Report the failure
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          tail -n 60 build.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=linux-${{ matrix.arch }}::/'
          echo

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "VBC_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error title=android::No signing key in the repository secrets (ANDROID_KEYSTORE_BASE64) - a release APK must be signed with the release key. See tools/make_release_key.ps1."
            exit 1
          else
            echo "No signing key in the secrets: the APK is signed with a debug key."
          fi

      - name: Build
        env:
          VBC_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          VBC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          set -o pipefail
          official=""
          [ "$OFFICIAL" = "ON" ] && official="-Pofficial=true"
          [ -n "$PRERELEASE" ] && official="$official -Pprerelease=${PRERELEASE#*-}"
          chmod +x gradlew
          ./gradlew assembleRelease $official --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: Package
        run: |
          set -e
          base=$(sed -n 's/^set(VBGO_VERSION "\([^"]*\)")/\1/p' CMakeLists.txt)
          if [ -n "$PRERELEASE" ]; then version="v$base-${PRERELEASE#*-}"
          elif [ "$OFFICIAL" = "ON" ]; then version="v$base"
          else version="v$base-dev.$(git rev-list --count HEAD)"; fi
          # One APK for both: Meta Quest (the VR app) and Android phones,
          # tablets and handhelds (the flat app) - 64-bit ARM.
          apk="VBoyColor-$version-quest-android-arm64"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk.apk"
          # Which key signed it - the same SHA-256 on every build = each one
          # installs over the last.
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner
          { echo "### APK signature"; echo '```'; "$apksigner" verify --print-certs "$apk.apk" | grep -E "certificate (DN|SHA-256)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
          echo "PACKAGE=$apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}.apk
          if-no-files-found: error

      - name: Report the failure
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          grep -E "error|Error|FAILED|What went wrong" -A3 build.log | head -n 50 > failure.log || true
          [ -s failure.log ] || tail -n 60 build.log > failure.log
          sed 's/%/%25/g' failure.log | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=android::/'
          echo

  # The RetroArch core (platform/libretro): one zip per platform - the core
  # and its .info file.
  libretro:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2022
          # (Linux: built in manylinux_2_28 - glibc 2.28 - so the core
          # loads on older systems too, handheld firmwares among them)
          - platform: linux-x64
            os: ubuntu-22.04
            image: quay.io/pypa/manylinux_2_28_x86_64
          - platform: linux-arm64
            os: ubuntu-22.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
          - platform: macos
            os: macos-14
          - platform: android-arm64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build (Linux, in manylinux)
        if: matrix.image
        run: |
          set -o pipefail
          docker run --rm -v "$PWD":/src -w /src -e OFFICIAL -e PRERELEASE ${{ matrix.image }} bash -c '
            set -e
            export PATH=/opt/python/cp312-cp312/bin:$PATH
            command -v git > /dev/null || dnf install -y -q git
            command -v cmake > /dev/null || pip install -q cmake
            git config --global --add safe.directory /src
            cmake -S platform/libretro -B build/libretro -DCMAKE_BUILD_TYPE=Release -DVBC_STATIC_RUNTIME=OFF -DVBGO_RELEASE_BUILD=$OFFICIAL -DVBGO_PRERELEASE="${PRERELEASE#*-}"
            cmake --build build/libretro --parallel
          ' 2>&1 | tee build.log

      - name: Configure
        if: ${{ !matrix.image }}
        run: |
          set -o pipefail
          extra=()
          case "${{ matrix.platform }}" in
            windows-x64) extra=(-A x64) ;;
            macos) extra=(-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15) ;;
            android-arm64) extra=(-DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21) ;;
          esac
          cmake -S platform/libretro -B build/libretro -DCMAKE_BUILD_TYPE=Release "${extra[@]}" -DVBGO_RELEASE_BUILD=$OFFICIAL -DVBGO_PRERELEASE="${PRERELEASE#*-}" 2>&1 | tee build.log

      - name: Build
        if: ${{ !matrix.image }}
        run: |
          set -o pipefail
          cmake --build build/libretro --config Release --parallel 2>&1 | tee build.log

      - name: Package
        run: |
          set -e
          version=$(sed -n 's/.*kGeneratedVersionString = "\([^"]*\)".*/\1/p' build/libretro/generated/Version.h)
          # (Windows: "win64", not "windows-x64" - the app's updater up to
          # 1.0.0 beta 7 takes any release zip named "-windows-" for its own)
          name=${{ matrix.platform }}; [ "$name" = windows-x64 ] && name=win64
          dir=vboycolor_libretro-$version-$name
          mkdir -p "$dir"
          case "${{ matrix.platform }}" in
            windows-x64) cp build/libretro/Release/vboycolor_libretro.dll "$dir/" ;;
            macos) cp build/libretro/vboycolor_libretro.dylib "$dir/"; strip -x "$dir/vboycolor_libretro.dylib" ;;
            android-arm64) cp build/libretro/vboycolor_libretro_android.so "$dir/"
                           "$ANDROID_NDK_LATEST_HOME"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip "$dir/vboycolor_libretro_android.so" ;;
            *) cp build/libretro/vboycolor_libretro.so "$dir/"; strip "$dir/vboycolor_libretro.so" ;;
          esac
          cp platform/libretro/vboycolor_libretro.info platform/libretro/INSTALL.txt "$dir/"
          cp -r LICENSE THIRD-PARTY-NOTICES.md licenses "$dir/"
          if [ "${{ matrix.platform }}" = windows-x64 ]; then 7z a -tzip "$dir.zip" "$dir" > /dev/null; else zip -qr "$dir.zip" "$dir"; fi
          echo "PACKAGE=$dir" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}.zip
          if-no-files-found: error

      - name: Report the failure
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          tail -n 60 build.log | sed 's/%/%25/g; s/\r//g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=libretro ${{ matrix.platform }}::/'
          echo

  # The RetroArch core for the Nintendo Switch (homebrew - RetroArch for the
  # Switch, libnx): the Switch can't load a core from a file, so each core is
  # a whole RetroArch with the core linked in - one .nro per core
  # (vboycolor_libretro_libnx.nro), put in RetroArch's cores folder on the SD
  # card (platform/libretro/INSTALL-switch.txt). Built in devkitPro's
  # devkitA64 image: the core as a static library (VBC_STATIC_CORE), then
  # RetroArch's Makefile.libnx with it as libretro_libnx.a.
  switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    env:
      # The RetroArch release the core goes into.
      RETROARCH_VERSION: v1.22.2
    defaults:
      run:
        shell: bash
    steps:
      - name: Tools
        run: |
          set -e
          apt-get update -qq
          # (RetroArch's Switch libraries come with the image - devkitPro's
          # package server doesn't serve CI machines)
          apt-get install -y -qq cmake git zip python3 > /dev/null

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: The core (static)
        run: |
          set -eo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/third_party/beetle-vb-libretro"
          cmake -S platform/libretro -B build/switch -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/Switch.cmake" \
            -DCMAKE_BUILD_TYPE=Release -DVBC_STATIC_CORE=ON -DVBGO_RELEASE_BUILD=$OFFICIAL \
            -DVBGO_PRERELEASE="${PRERELEASE#*-}" 2>&1 | tee build.log
          cmake --build build/switch --parallel 2>&1 | tee build.log

      - name: RetroArch with the core
        run: |
          set -eo pipefail
          git clone -q --depth 1 --branch "$RETROARCH_VERSION" https://github.com/libretro/RetroArch.git retroarch
          cp build/switch/vboycolor_libretro.a retroarch/libretro_libnx.a
          cd retroarch
          make -f Makefile.libnx -j"$(nproc)" APP_TITLE="VBoy Color" APP_AUTHOR="yuk27, libretro Team" 2>&1 | tee ../build.log | grep -E "error|warning: .*libretro_libnx|Linking|built" || true
          test -f retroarch_switch.nro

      - name: Package
        run: |
          set -e
          version=$(sed -n 's/.*kGeneratedVersionString = "\([^"]*\)".*/\1/p' build/switch/generated/Version.h)
          dir=vboycolor_libretro-$version-switch
          # (the SD card's layout: copy the retroarch folder onto the card's root)
          mkdir -p "$dir/retroarch/cores" "$dir/retroarch/info"
          cp retroarch/retroarch_switch.nro "$dir/retroarch/cores/vboycolor_libretro_libnx.nro"
          cp platform/libretro/vboycolor_libretro.info "$dir/retroarch/info/vboycolor_libretro_libnx.info"
          cp platform/libretro/INSTALL-switch.txt "$dir/INSTALL.txt"
          cp LICENSE THIRD-PARTY-NOTICES.md "$dir/"
          cp -r licenses "$dir/"
          (cd "$dir" && zip -qr "../$dir.zip" .)
          echo "PACKAGE=$dir" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}.zip
          if-no-files-found: error

      - name: Report the failure
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          grep -E "error|undefined reference|multiple definition" build.log | head -n 40 | sed 's/%/%25/g; s/\r//g' | sed 's/^/::error title=switch::/' || true
          tail -n 40 build.log | sed 's/%/%25/g; s/\r//g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=switch (end of log)::/'
          echo

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, android, libretro, switch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # (release-notes/<tag>.md: what's new, written for players - at the top of the release)
      - uses: actions/checkout@v4
        with:
          sparse-checkout: release-notes
          path: src

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # What's new (if written), then which download is for which device - above GitHub's list of changes.
      - name: Release notes
        run: |
          set -e
          notes="src/release-notes/${GITHUB_REF_NAME}.md"
          cd dist
          apk=$(ls VBoyColor-*-quest-android-arm64.apk)
          win=$(ls VBoyColor-*-windows-x64.zip)
          lin=$(ls VBoyColor-*-linux-x64.tar.gz)
          linarm=$(ls VBoyColor-*-linux-arm64.tar.gz)
          {
            if [ -f "../$notes" ]; then cat "../$notes"; echo; fi
            echo "## Which download?"
            echo
            echo "| Your device | Download |"
            echo "|---|---|"
            echo "| **Meta Quest** 2, 3, 3S, Pro - in VR, in 3D | \`$apk\` |"
            echo "| **Android phones, tablets and handhelds** (Android 10 or newer, 64-bit ARM, Vulkan - nearly every device from the last several years; Retroid, AYN, Anbernic and other Android handhelds too) - touch controls or a gamepad | \`$apk\` (the same file) |"
            echo "| **Windows** 10 / 11, 64-bit, with a Vulkan graphics driver - \`VBoyColor.exe\` plays in a window; \`VBoyColorVR.exe\` in a PC VR headset (Quest Link / Air Link, Virtual Desktop, SteamVR) | \`$win\` |"
            echo "| **Linux** x86-64 with Vulkan - \`VBoyColor\` plays in a window; \`VBoyColorVR\` in a PC VR headset (SteamVR) | \`$lin\` |"
            echo "| **Steam Frame**, and Linux ARM64 with Vulkan - \`VBoyColorVR\` in VR, in 3D, as a non-Steam game (see docs/STEAM_FRAME.md); \`VBoyColor\` in a window | \`$linarm\` |"
            echo "| **RetroArch** (or another libretro frontend) on Windows, Linux (x86-64 and ARM64), macOS or Android - the colors and the 3D for a normal screen, as a core | \`vboycolor_libretro-...-<platform>.zip\` |"
            echo "| **Nintendo Switch** (homebrew, RetroArch for the Switch) - the RetroArch core; copy its \`retroarch\` folder onto the SD card | \`vboycolor_libretro-...-switch.zip\` |"
            echo
            echo "Not yet as an app: macOS and the Nintendo Switch (the RetroArch core runs on both), iPhone / iPad, 32-bit Android. Other Android VR headsets are untested."
            echo
            echo "VBoy Color updates itself from here (About -> Update). No games are included - use only ROMs you made from cartridges you own."
            echo
          } > ../release-notes.md
          cat ../release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
          generate_release_notes: true
          # v1.0.0-beta.1 and the like: a pre-release
          prerelease: ${{ contains(github.ref_name, '-') }}
